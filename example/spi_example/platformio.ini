; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:spi_example]
platform = teensy
board = teensy41
framework = arduino
board_build.usb_type = usb_midi
board_build.f_cpu = 600000000  ; Run at 600MHz for best performance
build_flags = 
    -DUSE_DMA=1
    -DUSE_MIDI=1
    -DDEBUG_DMA=1  ; Enable DMA debugging output
monitor_speed = 115200

; For local development, use the local library
lib_deps = 
    ${platformio.libdeps_dir}/../../

; For any external fonts or assets
lib_extra_dirs = 
    lib/Fonts
    lib/Inc
